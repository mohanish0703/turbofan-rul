# Defaults for every dataset. Per-dataset files (fd00X.yaml) and extra files
# (e.g. smoke.yaml) are merged on top, in that order.
seed: 42

data:
  raw_dir: data/raw/CMAPSS

preprocess:
  # Piece-wise linear target: RUL is flat at rul_cap early in life, then decreases linearly.
  rul_cap: 125
  # Sensors whose pooled within-operating-condition variance (raw units) is below this are dropped.
  variance_threshold: 1.0e-4
  # KMeans clusters on the 3 operating settings; 1 = single global scaler.
  n_conditions: 1
  window_length: 30

cv:
  n_folds: 5

# Tabular baselines (Phase 2). Hand-set, CPU-friendly values; not tuned.
models:
  random_forest:
    n_estimators: 200
    min_samples_leaf: 10
    max_features: 0.5
  xgboost:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
